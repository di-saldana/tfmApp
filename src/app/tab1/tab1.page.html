<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Events
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Events</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar placeholder="Search Event"></ion-searchbar>

  <ion-card *ngFor="let event of evento">
    <ion-img [src]="event.images[0].url"></ion-img>
    <ion-card-header>
      <ion-card-title>{{ event.name }}</ion-card-title> 
    </ion-card-header>

    <ion-card-content>
      <ion-icon name="calendar"></ion-icon>
      {{ event.dates.start.localDate }} 
      <br>  
      <ion-icon name="pin"></ion-icon>
      {{ event._embedded.venues[0].name }}, {{ event._embedded.venues[0].city.name }}
    </ion-card-content>

    <ion-button shape="round" class="ion-align-self-center">
      <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
    </ion-button>

    <ion-button shape="round" class="ion-align-self-center" (click)="addEvent(event)">
      <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
    </ion-button>
  </ion-card>
</ion-content>
