<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Events
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Events</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-img src="assets/hozier_event.png"></ion-img>
    <ion-card-header>
      <ion-card-title>Hozier</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-icon name="calendar"></ion-icon>
      Lunes, 1 de julio de 2024
        <br>  
      <ion-icon name="pin"></ion-icon>
      WiZink Center, Madrid
    </ion-card-content>
  </ion-card>

</ion-content>
