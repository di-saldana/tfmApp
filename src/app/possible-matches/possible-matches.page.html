<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>People interested</ion-title>

    <!-- Settings -->
    <ion-buttons slot="start">
      <ion-button routerLink="/tabs/settings"> 
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Chat -->
    <ion-buttons slot="end">
      <ion-button routerLink="/tabs/chat">
        <ion-icon name="chatbubble-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">People interested</ion-title>
      <!-- TODO: Poner in X event -->
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let profile of profiles">
    <ion-img alt="Profile Image" src="https://ionicframework.com/docs/img/demos/avatar.svg"></ion-img> 
    <ion-card-header>
      <ion-card-title class="center-text">{{ profile.name }}, {{profile.age}}</ion-card-title>
      <ion-icon name="add" 
                style="position: absolute; top: 15px; right: 25px; font-size: 30px; color: var(--ion-color-primary);">
      </ion-icon>
    </ion-card-header>
  </ion-card>

  <ion-footer>
    <ion-toolbar style="visibility: hidden;"/>
  </ion-footer>
</ion-content>
