<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>People interested</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">People interested</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let profile of profiles">
    <ion-card-content>
      <div style="display: flex; align-items: center;">
        
        <ion-avatar slot="start" (click)="goToProfile(profile)">
          <img [src]="profile.image" alt="Profile Image">
        </ion-avatar>

        <div style="margin-left: 15px;">
          <ion-card-title>{{ profile.name }}, {{ profile.age }}</ion-card-title>
          <h2 style="margin: 0; color: gray;">{{ profile.location }}</h2>
        </div>
      </div>

      <!-- <div style="margin-top: 10px;"> 
        <ion-chip style="margin-top: 15px;" *ngFor="let event of profile.events">
          <ion-avatar>
            <img alt="Artist Image" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
          <ion-label>{{ event }}</ion-label>
        </ion-chip>
      </div> -->

      <div style="display: flex; margin-top: 15px; gap: 10px;">
        <ion-avatar *ngFor="let artist of profile.artists" style="width: 80px; height: 80px;">
          <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Artist Avatar"> 
        </ion-avatar>
      </div>

      <ion-icon name="add" 
                style="position: absolute; top: 25px; right: 25px; font-size: 30px; color: var(--ion-color-primary);">
      </ion-icon>
    </ion-card-content>
  </ion-card>

  <ion-footer>
    <ion-toolbar style="visibility: hidden;"/>
  </ion-footer>
</ion-content>
