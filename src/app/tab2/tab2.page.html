<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Match
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Matches</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let profile of profiles" lines="none">
      <ion-card style="width: 100%;">
        <ion-card-content>
          <div style="display: flex; align-items: center;">
            
            <ion-avatar slot="start" (click)="goToProfile(profile)">
              <img [src]="profile.image" alt="Profile Image">
            </ion-avatar>

            <div style="margin-left: 15px;">
              <h1 style="margin: 0;">{{ profile.name }}, {{ profile.age }}</h1>
              <p style="margin: 0; color: gray;">{{ profile.location }}</p>
            </div>

            <ion-icon name="chatbubble-outline" (click)="goToChat(profile)"
                      style="position: absolute; top: 25px; right: 25px; font-size: 30px; color: var(--ion-color-primary);">
            </ion-icon>
            
          </div>

          <div style="margin-top: 10px;"> 
            <ion-chip style="margin-top: 15px;" *ngFor="let event of profile.events">
              <ion-avatar>
                <img alt="Artist Image" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
              </ion-avatar>
              <ion-label>{{ event }}</ion-label>
            </ion-chip>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>

  <ion-footer>
    <ion-toolbar style="visibility: hidden;"/>
  </ion-footer>
</ion-content>
