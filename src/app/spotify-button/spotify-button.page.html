<ion-content [fullscreen]="true">
  <div class="center-container">

    <img src="../assets/spotify-3d-logo.png" alt="Spotify Logo" class="spotify-logo"/>
    <h3>Share your music taste with others!</h3>
    <ion-button (click)="onAuthClick()" class="ion-margin-top" expand="block" mode="ios" fill="outline">
      Link with Spotify
      <ion-icon slot="end" name="musical-notes-outline"></ion-icon>
    </ion-button> 
    
    <p class="ion-margin-top centered-text">
      <a routerLink="/tabs/tab1" class="sign-up-link">Skip for now </a>
    </p>

  </div>
</ion-content>
