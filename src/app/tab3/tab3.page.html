<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Profile
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Profile</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
      <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/card-media.png" />
      <ion-card-header>
        <ion-card-title>{{ userName }}, {{ userAge }}</ion-card-title>
        <ion-card-subtitle>{{ userDistance }} mi</ion-card-subtitle>
      </ion-card-header>
  </ion-card>

  <ion-card>
    <ion-card-content>
      <ion-label>
        <h3>Favorite Artists</h3>
      </ion-label>
      <ion-chip *ngFor="let artist of favoriteArtists">
        <ion-label>{{ artist }}</ion-label>
      </ion-chip>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-content>
      <ion-label>
        <h3>Favorite Songs</h3>
      </ion-label>
      <ion-chip *ngFor="let song of favoriteSongs">
        <ion-label>{{ song }}</ion-label>
      </ion-chip>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-content>
      <ion-label>
        <h3>Favorite Music Genres</h3>
      </ion-label>
      <ion-chip *ngFor="let genre of favoriteGenres">
        <ion-label>{{ genre }}</ion-label>
      </ion-chip>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-content>
      <ion-label>
        <h3>My Events</h3>
      </ion-label>
      <ion-chip *ngFor="let event of events">
        <ion-label>{{ event }}</ion-label>
      </ion-chip>
    </ion-card-content>
  </ion-card>

  <ion-footer>
    <ion-toolbar style="visibility: hidden;"/>
  </ion-footer>
</ion-content>
